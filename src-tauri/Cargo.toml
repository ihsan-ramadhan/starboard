[package]
name = "starboard"
version = "0.1.0"
description = "Starboard Desktop Dashboard"
authors = ["PT Stargate Pacific Resources"]
edition = "2021"

[lib]
name = "starboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# The shell needs nothing but Tauri itself. Everything the old IPC commands
# pulled in -- postgres, calamine, bcrypt, chrono, regex -- now lives only in
# crates/server, which is the single place that touches the database.
tauri = { version = "2.1.1", features = [] }
