[package]
name = "starboard"
version = "0.1.0"
description = "Starboard Desktop Dashboard"
authors = ["PT Stargate Pacific Resources"]
edition = "2021"

[lib]
name = "starboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# The shell stays thin: no database, no Excel parsing, none of what the old IPC
# commands pulled in. The two commands it does own exist because a web page
# cannot read a file path, and live sync needs exactly that.
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
